syntax = "proto3";
package listentogether;

message Envelope {
    string type = 1;
    bytes payload = 2;
    bool compressed = 3;
}
message TrackInfo {
    string id = 1;
    string title = 2;
    string artist = 3;
    string album = 4;
    int64 duration = 5;
    string thumbnail = 6;
    string suggested_by = 7;
}
message RoomState {
    string room_code = 1;
    string host_id = 2;
    TrackInfo current_track = 4;
    bool is_playing = 5;
    int64 position = 6;
    int64 last_update = 7;
    float volume = 8;
    uint64 revision = 10;
}
message ClientCapabilities {
    bool supports_protobuf = 1;
    bool supports_compression = 2;
    string client_version = 3;
}
message JoinRoomPayload {
    string room_code = 1;
    string username = 2;
}
message JoinApprovedPayload {
    string room_code = 1;
    string user_id = 2;
    string session_token = 3;
    RoomState state = 4;
}
message SyncStatePayload {
    TrackInfo current_track = 1;
    bool is_playing = 2;
    int64 position = 3;
    int64 last_update = 4;
    float volume = 6;
    uint64 revision = 7;
}
message PlaybackActionPayload {
    string action = 1;
    string track_id = 2;
    int64 position = 3;
    TrackInfo track_info = 4;
    bool insert_next = 5;
    string queue_title = 7;
    float volume = 8;
    int64 server_time = 9;
    uint64 revision = 10;
    int64 captured_at_server_time = 11;
}
message PingPayload {
    int64 client_time = 1;
    uint64 sequence = 2;
}
message ErrorPayload {
	string code = 1;
	string message = 2;
}
message KickedPayload {
	string reason = 1;
}