<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<meta name="darkreader-lock" content="true" />
		<meta name="robots" content="noindex, nofollow" />

		<title>Listen With Me – Eric Lowry</title>

		<meta name="author" content="Eric Lowry" />
		<meta name="description" content="Listen along to music with Eric Lowry." />
		<meta name="language" content="EN" />

		<!-- Open Graph / Social Sharing -->
		<meta property="og:type" content="music.song" />
		<meta property="og:site_name" content="Eric Lowry" />
		<meta property="og:title" content="Listen With Me – Eric Lowry" />
		<meta property="og:description" content="Listen along to music with Eric Lowry." />
		<meta property="og:image" content="https://eric-lowry.com/assets/images/touch-icon.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Listen With Me – Eric Lowry" />
		<meta name="twitter:description" content="Listen along to music with Eric Lowry." />
		<meta name="twitter:image" content="https://eric-lowry.com/assets/images/touch-icon.png" />

		<meta name="theme-color" content="#e29186" />
		<meta name="theme-color" content="#6d0a1f" media="(prefers-color-scheme: light)" />

		<link rel="icon" href="/assets/images/favicon.png" type="image/png" sizes="512x512" />
		<link
			rel="icon"
			href="/assets/images/favicon.ico"
			type="image/x-icon"
			sizes="16x16 32x32 48x48"
		/>
		<link rel="apple-touch-icon" href="/assets/images/touch-icon.png" sizes="192x192" />

		<link rel="stylesheet" href="/src/css/main.css" />
		<link rel="stylesheet" href="/listen/listen.css" />
	</head>
	<body>
		<div id="ambient-backdrop" class="ambient-backdrop" aria-hidden="true"></div>

		<main class="listen-main">
			<article id="player-card" class="player-card" hidden>
				<header class="card-header">
					<div class="badge-live">
						<span class="pulse-dot" aria-hidden="true"></span>
						<span id="playback-status-text">Now Listening</span>
					</div>
					<div class="equalizer-anim" aria-hidden="true">
						<span class="eq-bar"></span>
						<span class="eq-bar"></span>
						<span class="eq-bar"></span>
						<span class="eq-bar"></span>
					</div>
				</header>

				<a
					id="link-album-art"
					class="art-frame"
					href="#"
					rel="noopener noreferrer"
					aria-label="Play on YouTube Music"
				>
					<img id="album-art" src="" alt="Album Art" />
					<div class="art-play-overlay" aria-hidden="true">
						<div class="art-play-button">
							<svg
								id="playback-icon"
								viewBox="0 0 24 24"
								width="28"
								height="28"
								fill="currentColor"
							>
								<polygon points="8,5 19,12 8,19" />
							</svg>
						</div>
					</div>
				</a>

				<div class="progress-bar">
					<div id="progress-fill" class="progress-fill"></div>
				</div>

				<div class="track-info">
					<h1 id="track-title" class="track-title"></h1>
					<div class="track-album-info">
						<h2 id="track-artist" class="track-artist"></h2>
						<p id="track-album" class="track-album"></p>
					</div>
				</div>

				<a id="btn-metrolist" class="action-link" href="#" rel="noopener noreferrer" hidden>
					<svg
						viewBox="0 0 24 24"
						width="20"
						height="20"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M3 18v-6a9 9 0 0 1 18 0v6" />
						<path
							d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"
						/>
					</svg>
					<span>Listen With Me</span>
				</a>
			</article>

			<section id="empty-card" class="empty-card" hidden>
				<div class="empty-icon" aria-hidden="true">
					<svg
						viewBox="0 0 24 24"
						width="48"
						height="48"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<circle cx="12" cy="12" r="10" />
						<line x1="12" y1="8" x2="12" y2="12" />
						<line x1="12" y1="16" x2="12.01" y2="16" />
					</svg>
				</div>
				<h1 class="empty-heading">No Track Specified</h1>
				<p class="empty-text">
					Scan the QR code from the stream overlay or open a shared listen link to tune in
					together.
				</p>
				<a class="empty-action" href="/">Back to Portfolio</a>
			</section>

			<footer id="page-footer" class="page-footer">
				<a href="/">Eric Lowry &bull; Portfolio</a>
			</footer>
		</main>

		<script type="module" src="/listen/listen.js"></script>
	</body>
</html>
