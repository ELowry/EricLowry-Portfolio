<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<meta name="darkreader-lock" content="true" />
		<meta name="robots" content="noindex, nofollow" />

		<title>Listen With Me – Eric Lowry</title>

		<meta name="author" content="Eric Lowry" />
		<meta name="description" content="Listen along to music with Eric Lowry." />
		<meta name="language" content="EN" />

		<!-- Open Graph / Social Sharing -->
		<meta property="og:type" content="music.song" />
		<meta property="og:site_name" content="Eric Lowry" />
		<meta property="og:title" content="Listen With Me – Eric Lowry" />
		<meta property="og:description" content="Listen along to music with Eric Lowry." />
		<meta property="og:image" content="https://eric-lowry.com/assets/images/touch-icon.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Listen With Me – Eric Lowry" />
		<meta name="twitter:description" content="Listen along to music with Eric Lowry." />
		<meta name="twitter:image" content="https://eric-lowry.com/assets/images/touch-icon.png" />

		<meta name="theme-color" content="#e29186" />
		<meta name="theme-color" content="#6d0a1f" media="(prefers-color-scheme: light)" />

		<link rel="icon" href="/assets/images/favicon.png" type="image/png" sizes="512x512" />
		<link
			rel="icon"
			href="/assets/images/favicon.ico"
			type="image/x-icon"
			sizes="16x16 32x32 48x48"
		/>
		<link rel="apple-touch-icon" href="/assets/images/touch-icon.png" sizes="192x192" />

		<link rel="stylesheet" href="/src/css/main.css" />

		<style>
			html {
				overflow-x: hidden;
				overflow-y: auto;
			}

			body {
				display: flex;
				position: relative;
				flex-direction: column;
				align-items: center;
				box-sizing: border-box;
				margin: 0;
				background-color: var(--color-background);
				padding: 2rem 1.5rem;
				min-height: 100vh;
				overflow-x: hidden;
				overflow-y: auto;
				color: var(--color-text);
				font-family: var(--font-sans);
			}

			.ambient-backdrop {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				opacity: 0;
				mix-blend-mode: soft-light;
				image-rendering: crisp-edges;
				image-rendering: -moz-crisp-edges;
				image-rendering: -o-crisp-edges;
				image-rendering: -webkit-optimize-contrast;
				width: calc(max(100vw, 100vh) * (16 / 9));
				height: max(100vw, 100vh);
				-ms-interpolation-mode: nearest-neighbor;
				z-index: 0;
				transition:
					opacity 0.8s ease-in-out,
					background-image 0.5s ease-in-out;
				background-position: center;
				background-size: cover;
				pointer-events: none;

				&.is-visible {
					opacity: 0.2;
				}
			}

			.listen-main {
				display: flex;
				position: relative;
				flex-direction: column;
				align-items: center;
				gap: 1.5rem;
				z-index: 1;
				margin: auto 0;
				width: 100%;
				max-width: clamp(280px, 440px, 50vmin);
			}

			.player-card,
			.empty-card {
				position: relative;
				opacity: 0;
				backdrop-filter: var(--backdrop-blur);
				box-sizing: border-box;
				border: var(--border-width) solid var(--color-border);
				background: linear-gradient(
					180deg,
					var(--color-overlay-dark) 0%,
					var(--color-background) 100%
				);
				padding: 1.75rem;
				width: 100%;

				&.is-visible {
					animation: card-fade-in 0.6s var(--transition-easing) both;
				}

				&[hidden] {
					display: none !important;
				}
			}

			.card-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 1.25rem;
				border-bottom: 1px solid var(--color-border);
				padding-bottom: 0.75rem;

				.badge-live {
					display: inline-flex;
					align-items: center;
					gap: 0.5rem;
					color: var(--color-accent);
					font-size: 0.85rem;
					font-family: var(--font-mono);
					letter-spacing: 0.08em;
					text-transform: uppercase;

					.pulse-dot {
						animation: pulse-glow 2s infinite ease-in-out;
						border-radius: 50%;
						background-color: var(--color-accent);
						width: 8px;
						height: 8px;
					}
				}

				.equalizer-anim {
					display: flex;
					align-items: flex-end;
					gap: 3px;
					height: 14px;

					.eq-bar {
						transform-origin: bottom;
						animation: eq-bounce 1.2s infinite ease-in-out;
						border-radius: 1px;
						background-color: var(--color-accent);
						width: 3px;
						height: 100%;

						&:nth-child(1) {
							animation-delay: 0s;
						}
						&:nth-child(2) {
							animation-delay: 0.2s;
						}
						&:nth-child(3) {
							animation-delay: 0.4s;
						}
						&:nth-child(4) {
							animation-delay: 0.1s;
						}
					}
				}
			}

			.art-frame {
				display: block;
				position: relative;
				transition: border-color var(--transition-duration) var(--transition-easing);
				cursor: pointer;
				margin-bottom: 1.25rem;
				border: var(--border-width) solid var(--color-border);
				background-color: var(--color-overlay);
				aspect-ratio: 1 / 1;
				width: 100%;
				overflow: hidden;
				text-decoration: none;

				img {
					display: block;
					transition:
						transform var(--transition-duration) var(--transition-easing),
						filter var(--transition-duration) var(--transition-easing);
					width: 100%;
					height: 100%;
					object-fit: cover;

					&.fallback-crop {
						transform: scale(1.34);
					}
				}

				.art-play-overlay {
					display: flex;
					position: absolute;
					justify-content: center;
					align-items: center;
					opacity: 0.85;
					transition:
						background-color var(--transition-duration) var(--transition-easing),
						opacity var(--transition-duration) var(--transition-easing);
					inset: 0;
					background-color: rgba(0, 0, 0, 0.2);
					pointer-events: none;

					.art-play-button {
						display: flex;
						justify-content: center;
						align-items: center;
						transform: scale(0.9);
						backdrop-filter: var(--backdrop-blur);
						transition:
							transform var(--transition-duration) var(--transition-easing),
							background-color var(--transition-duration) var(--transition-easing),
							color var(--transition-duration) var(--transition-easing),
							filter var(--transition-duration-long) var(--transition-easing),
							-o-filter var(--transition-duration-long) var(--transition-easing),
							-ms-filter var(--transition-duration-long) var(--transition-easing),
							-moz-filter var(--transition-duration-long) var(--transition-easing),
							-webkit-filter var(--transition-duration-long) var(--transition-easing);
						border: var(--border-width) solid var(--color-accent);
						border-radius: 50%;
						background-color: var(--color-overlay-dark);
						width: 58px;
						height: 58px;
						color: var(--color-accent);

						svg {
							fill: currentColor;
							margin-left: 3px;
						}
					}
				}

				&:hover,
				&:focus-visible {
					border-color: var(--color-accent);

					img {
						transform: scale(1.03);
						filter: brightness(0.85) blur(4px);

						&.fallback-crop {
							transform: scale(1.38);
						}
					}

					.art-play-overlay {
						opacity: 1;
						background-color: rgba(0, 0, 0, 0.4);

						.art-play-button {
							transform: scale(1);
							border-color: var(--color-accent);
							background-color: var(--color-accent);
							color: var(--color-background);

							svg {
								fill: var(--color-background);
							}
						}
					}
				}
			}

			.track-info {
				margin-bottom: 1.5rem;
				text-align: left;

				.track-title {
					margin: 0 0 0.35rem 0;
					color: var(--color-text);
					font-weight: 700;
					font-size: 1.5rem;
					line-height: 1.2;
					font-family: var(--font-sans);
					word-break: break-word;
				}

				.track-album-info {
					display: flex;
					gap: 1rem;
				}

				.track-artist {
					margin: 0 0 0.35rem 0;
					color: var(--color-accent);
					font-weight: 400;
					font-size: 1.2rem;
					font-family: var(--font-mono);
					word-break: break-word;
				}

				.track-album {
					opacity: 0.75;
					margin: 0;
					color: var(--color-text);
					font-size: 0.9rem;
					font-family: var(--font-sans);
					word-break: break-word;
				}
			}

			.action-link {
				display: inline-flex !important;
				justify-content: center;
				align-items: center;
				gap: 0.65rem;
				transition: var(--transition-base);
				cursor: pointer;
				box-sizing: border-box;
				border: var(--border-width) solid var(--color-accent);
				padding: 0.8rem 1.25rem;
				width: 100%;
				color: var(--color-accent);
				font-weight: 600;
				font-size: 1rem;
				font-family: var(--font-sans);
				text-align: center;
				text-decoration: none;

				&[hidden] {
					display: none !important;
				}

				svg {
					transition: transform var(--transition-duration) var(--transition-easing);
				}

				&:hover,
				&:active {
					border-color: oklch(from var(--hex-accent) calc(l + 0.08) c h);
					background-color: oklch(from var(--hex-accent) calc(l + 0.08) c h);
					color: var(--color-background);
					text-decoration: none;

					svg {
						transform: scale(1.4);
					}
				}
			}

			.empty-card {
				text-align: center;

				.empty-icon {
					opacity: 0.6;
					margin: 1rem auto;
					color: var(--color-accent);
				}

				.empty-heading {
					margin: 0 0 0.5rem 0;
					color: var(--color-text);
					font-size: 1.4rem;
					font-family: var(--font-sans);
				}

				.empty-text {
					opacity: 0.75;
					margin: 0 0 1.5rem 0;
					font-size: 0.95rem;
					line-height: 1.5;
				}

				.empty-action {
					display: inline-block;
					border: var(--border-width) solid var(--color-accent);
					background-color: var(--color-highlight);
					padding: 0.65rem 1.25rem;
					color: var(--color-text);
					font-family: var(--font-sans);
					text-decoration: none;

					&:hover {
						background-color: oklch(
							from var(--hex-highlight) var(--luminocity-highlight) c h / 20%
						);
					}
				}
			}

			.page-footer {
				opacity: 0;
				margin-top: 0.5rem;
				text-align: center;

				&.is-visible {
					animation: pure-fade-in 0.6s var(--transition-easing) 0.1s both;
				}

				a {
					opacity: 0.6;
					transition: var(--transition-base);
					color: var(--color-text);
					font-size: 0.85rem;
					font-family: var(--font-mono);
					text-decoration: none;

					&:hover {
						opacity: 1;
						color: var(--color-accent);
						text-decoration: underline;
					}
				}
			}

			@keyframes card-fade-in {
				from {
					transform: translateY(16px);
					opacity: 0;
				}
				to {
					transform: translateY(0);
					opacity: 1;
				}
			}

			@keyframes pure-fade-in {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}

			@keyframes pulse-glow {
				0%,
				100% {
					transform: scale(1);
					opacity: 1;
				}
				50% {
					transform: scale(0.8);
					opacity: 0.4;
				}
			}

			@keyframes eq-bounce {
				0%,
				100% {
					transform: scaleY(0.25);
				}
				50% {
					transform: scaleY(1);
				}
			}
		</style>
	</head>
	<body>
		<div id="ambient-backdrop" class="ambient-backdrop" aria-hidden="true"></div>

		<main class="listen-main">
			<article id="player-card" class="player-card" hidden>
				<header class="card-header">
					<div class="badge-live">
						<span class="pulse-dot" aria-hidden="true"></span>
						<span>Now Listening</span>
					</div>
					<div class="equalizer-anim" aria-hidden="true">
						<span class="eq-bar"></span>
						<span class="eq-bar"></span>
						<span class="eq-bar"></span>
						<span class="eq-bar"></span>
					</div>
				</header>

				<a
					id="link-album-art"
					class="art-frame"
					href="#"
					rel="noopener noreferrer"
					aria-label="Play on YouTube Music"
				>
					<img id="album-art" src="" alt="Album Art" />
					<div class="art-play-overlay" aria-hidden="true">
						<div class="art-play-button">
							<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
								<polygon points="8,5 19,12 8,19" />
							</svg>
						</div>
					</div>
				</a>

				<div class="track-info">
					<h1 id="track-title" class="track-title"></h1>
					<div class="track-album-info">
						<h2 id="track-artist" class="track-artist"></h2>
						<p id="track-album" class="track-album"></p>
					</div>
				</div>

				<a id="btn-metrolist" class="action-link" href="#" rel="noopener noreferrer" hidden>
					<svg
						viewBox="0 0 24 24"
						width="20"
						height="20"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M3 18v-6a9 9 0 0 1 18 0v6" />
						<path
							d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"
						/>
					</svg>
					<span>Listen With Me</span>
				</a>
			</article>

			<section id="empty-card" class="empty-card" hidden>
				<div class="empty-icon" aria-hidden="true">
					<svg
						viewBox="0 0 24 24"
						width="48"
						height="48"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<circle cx="12" cy="12" r="10" />
						<line x1="12" y1="8" x2="12" y2="12" />
						<line x1="12" y1="16" x2="12.01" y2="16" />
					</svg>
				</div>
				<h1 class="empty-heading">No Track Specified</h1>
				<p class="empty-text">
					Scan the QR code from the stream overlay or open a shared listen link to tune in
					together.
				</p>
				<a class="empty-action" href="/">Back to Portfolio</a>
			</section>

			<footer id="page-footer" class="page-footer">
				<a href="/">Eric Lowry &bull; Portfolio</a>
			</footer>
		</main>

		<script type="module">
			/**
			 * Compresses and decompresses JSON payloads for URL-safe QR codes using native browser APIs.
			 */
			class QrPayloadCompressor {
				/**
				 * Converts a byte array into a URL-safe Base64 string.
				 * @param {Uint8Array} bytes
				 * @returns {string} The URL-safe Base64 string.
				 * @private
				 */
				static #bytesToBase64Url(bytes) {
					let binaryString = '';
					for (let i = 0; i < bytes.length; i++) {
						binaryString += String.fromCharCode(bytes[i]);
					}
					const base64 = btoa(binaryString);
					return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
				}

				/**
				 * Converts a URL-safe Base64 string into a byte array.
				 * @param {string} base64Url
				 * @returns {Uint8Array} The decoded byte array.
				 * @private
				 */
				static #base64UrlToBytes(base64Url) {
					let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
					while (base64.length % 4 !== 0) {
						base64 += '=';
					}
					const binaryString = atob(base64);
					const bytes = new Uint8Array(binaryString.length);
					for (let i = 0; i < binaryString.length; i++) {
						bytes[i] = binaryString.charCodeAt(i);
					}
					return bytes;
				}

				/**
				 * Compresses a JSON serializable data structure into a URL-safe Base64 string using native Deflate.
				 * @param {*} data
				 * @returns {Promise<string>} The compressed and encoded string.
				 */
				static async compress(data) {
					const jsonString = JSON.stringify(data);
					const stream = new Blob([jsonString]).stream();
					const compressedStream = stream.pipeThrough(
						new CompressionStream('deflate-raw')
					);
					const buffer = await new Response(compressedStream).arrayBuffer();
					return QrPayloadCompressor.#bytesToBase64Url(new Uint8Array(buffer));
				}

				/**
				 * Decompresses a URL-safe Base64 string back into the original JSON data structure.
				 * @param {string} encodedString
				 * @returns {Promise<*>} The parsed JSON data.
				 */
				static async decompress(encodedString) {
					const bytes = QrPayloadCompressor.#base64UrlToBytes(encodedString);
					const stream = new Blob([bytes]).stream();
					const decompressedStream = stream.pipeThrough(
						new DecompressionStream('deflate-raw')
					);
					const text = await new Response(decompressedStream).text();
					return JSON.parse(text);
				}
			}

			/**
			 * Controller managing data parsing, presentation, and user actions on the Listen page.
			 */
			class ListenPageController {
				#playerCard;
				#emptyCard;
				#pageFooter;
				#albumArt;
				#linkAlbumArt;
				#ambientBackdrop;
				#trackTitle;
				#trackArtist;
				#trackAlbum;
				#btnMetrolist;

				constructor() {
					this.#playerCard = document.getElementById('player-card');
					this.#emptyCard = document.getElementById('empty-card');
					this.#pageFooter = document.getElementById('page-footer');
					this.#albumArt = document.getElementById('album-art');
					this.#linkAlbumArt = document.getElementById('link-album-art');
					this.#ambientBackdrop = document.getElementById('ambient-backdrop');
					this.#trackTitle = document.getElementById('track-title');
					this.#trackArtist = document.getElementById('track-artist');
					this.#trackAlbum = document.getElementById('track-album');
					this.#btnMetrolist = document.getElementById('btn-metrolist');
				}

				/**
				 * Constructs a YouTube thumbnail image URL with specified resolution and file format.
				 * @param {string} youtubeId
				 * @param {Object} [options={}]
				 * @param {'maxres'|'hq'|'mq'|'default'} [options.quality='maxres']
				 * @param {'webp'|'jpg'} [options.format='webp']
				 * @returns {string} The constructed thumbnail URL.
				 */
				static #getThumbnailUrl(youtubeId, { quality = 'maxres', format = 'webp' } = {}) {
					const dir = format === 'webp' ? 'vi_webp' : 'vi';
					return `https://i.ytimg.com/${dir}/${encodeURIComponent(youtubeId)}/${quality}default.${format}`;
				}

				/**
				 * @param {string} youtubeId
				 * @returns {string} The constructed YouTube Music playback URL.
				 */
				static #buildYouTubeMusicUrl(youtubeId) {
					return `https://music.youtube.com/watch?v=${encodeURIComponent(youtubeId)}`;
				}

				/**
				 * @param {string} title
				 * @param {string} artist
				 * @returns {string} The constructed YouTube Music search query URL.
				 */
				static #buildYouTubeSearchUrl(title, artist) {
					const query = `${title} ${artist}`.trim();
					return `https://music.youtube.com/search?q=${encodeURIComponent(query)}`;
				}

				/**
				 * @param {string} code
				 * @returns {string} The constructed Metrolist Listen Together URL.
				 */
				static #buildMetrolistUrl(code) {
					return `https://metrolist.cc/listen?code=${encodeURIComponent(code)}`;
				}

				/**
				 * Updates the content attribute of an existing HTML meta tag.
				 * @param {string} selector
				 * @param {string} content
				 * @returns {void}
				 */
				static #setMetaContent(selector, content) {
					const meta = document.querySelector(selector);
					if (meta && content) {
						meta.setAttribute('content', content);
					}
				}

				/**
				 * Initializes the page state and renders either track details or empty view.
				 * @returns {Promise<void>}
				 */
				async init() {
					const songData = await this.#parseUrlParams();

					if (songData && songData.yt && !songData.title) {
						try {
							const response = await fetch(
								`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${encodeURIComponent(songData.yt)}`
							);
							if (response.ok) {
								const meta = await response.json();
								songData.title = meta.title || 'Unknown Track';
								songData.artist = meta.author_name || 'Unknown Artist';
							}
						} catch (error) {
							console.warn('Failed to fetch YouTube metadata client-side:', error);
						}
					}

					if (songData && (songData.title || songData.yt)) {
						this.#renderSong(songData);
					} else {
						this.#renderEmpty();
					}
				}

				/**
				 * Extracts song information from URL query parameters or hash fragments.
				 * @private
				 * @returns {Promise<Object|null>} The resolved song data or null if invalid.
				 */
				async #parseUrlParams() {
					const searchParams = new URLSearchParams(window.location.search);
					let encoded = searchParams.get('d') || searchParams.get('data');

					if (!encoded && window.location.hash) {
						const hashStr = window.location.hash.replace(/^#/, '');
						const hashParams = new URLSearchParams(hashStr);
						encoded = hashParams.get('d') || hashParams.get('data') || hashStr;
					}

					if (encoded) {
						try {
							const decompressed = await QrPayloadCompressor.decompress(encoded);
							if (Array.isArray(decompressed)) {
								return {
									title: decompressed[0] || '',
									artist: decompressed[1] || '',
									album: decompressed[2] || '',
									yt: decompressed[3] || '',
									art: decompressed[4] || '',
									code: decompressed[5] || '',
								};
							}
							if (typeof decompressed === 'object' && decompressed !== null) {
								return {
									title: decompressed.title || decompressed.t || '',
									artist: decompressed.artist || decompressed.a || '',
									album: decompressed.album || decompressed.b || '',
									yt:
										decompressed.yt
										|| decompressed.y
										|| decompressed.youtubeId
										|| '',
									art:
										decompressed.art
										|| decompressed.image
										|| decompressed.artUrl
										|| '',
									code:
										decompressed.code
										|| decompressed.c
										|| decompressed.listenCode
										|| '',
								};
							}
						} catch (error) {
							console.warn('Could not decompress QR payload:', error);
						}
					}

					const title = searchParams.get('title') || searchParams.get('t') || '';
					const artist = searchParams.get('artist') || searchParams.get('a') || '';
					const album = searchParams.get('album') || searchParams.get('b') || '';
					const yt =
						searchParams.get('yt')
						|| searchParams.get('y')
						|| searchParams.get('youtubeId')
						|| '';
					const art =
						searchParams.get('art')
						|| searchParams.get('image')
						|| searchParams.get('artUrl')
						|| '';
					const code =
						searchParams.get('code')
						|| searchParams.get('c')
						|| searchParams.get('listenCode')
						|| '';

					if (title || yt) {
						return { title, artist, album, yt, art, code };
					}

					return null;
				}

				/**
				 * Updates document title, description, and Open Graph / Twitter tags.
				 * @private
				 * @param {string} [title='']
				 * @param {string} [artist='']
				 * @param {string} [imageUrl='']
				 * @returns {void}
				 */
				#updateMetadata(title = '', artist = '', imageUrl = '') {
					const defaultTitle = 'Listen With Me – Eric Lowry';
					const defaultDesc = 'Listen along to music with Eric Lowry.';
					const defaultImage = `${window.location.origin}/assets/images/touch-icon.png`;

					const pageTitle =
						title && artist ? `${title} – ${artist} | Listen With Me` : defaultTitle;
					const pageDesc =
						title && artist
							? `Listen to "${title}" by ${artist} with Eric Lowry.`
							: defaultDesc;
					const pageImage = imageUrl || defaultImage;

					document.title = pageTitle;

					ListenPageController.#setMetaContent('meta[name="description"]', pageDesc);
					ListenPageController.#setMetaContent('meta[property="og:title"]', pageTitle);
					ListenPageController.#setMetaContent(
						'meta[property="og:description"]',
						pageDesc
					);
					ListenPageController.#setMetaContent('meta[property="og:image"]', pageImage);
					ListenPageController.#setMetaContent('meta[name="twitter:title"]', pageTitle);
					ListenPageController.#setMetaContent(
						'meta[name="twitter:description"]',
						pageDesc
					);
					ListenPageController.#setMetaContent('meta[name="twitter:image"]', pageImage);
				}

				/**
				 * Populates UI components with extracted song details and fades in presentation.
				 * @private
				 * @param {Object} songData
				 * @returns {void}
				 */
				#renderSong(songData) {
					const title = songData.title || 'Unknown Track';
					const artist = songData.artist || 'Unknown Artist';
					const album = songData.album || '';
					const youtubeId = songData.yt || '';
					const artUrl =
						songData.art
						|| (youtubeId ? ListenPageController.#getThumbnailUrl(youtubeId) : '');
					const ogImageUrl = youtubeId
						? ListenPageController.#getThumbnailUrl(youtubeId, {
								quality: 'maxres',
								format: 'jpg',
							})
						: artUrl;
					const backdropUrl = youtubeId
						? ListenPageController.#getThumbnailUrl(youtubeId, {
								quality: '',
								format: 'jpg',
							})
						: artUrl;
					const listenCode = songData.code || '';

					this.#trackTitle.textContent = title;
					this.#trackArtist.textContent = artist;

					if (album) {
						this.#trackAlbum.textContent = album;
						this.#trackAlbum.removeAttribute('hidden');
					} else {
						this.#trackAlbum.setAttribute('hidden', '');
					}

					if (backdropUrl) {
						this.#ambientBackdrop.style.backgroundImage = `url("${backdropUrl}")`;
						const backdropImg = new Image();
						backdropImg.src = backdropUrl;
						if (backdropImg.complete) {
							this.#ambientBackdrop.classList.add('is-visible');
						} else {
							backdropImg.addEventListener(
								'load',
								() => {
									this.#ambientBackdrop.classList.add('is-visible');
								},
								{ once: true }
							);
						}
					}

					if (artUrl) {
						this.#albumArt.classList.remove('fallback-crop');
						this.#albumArt.src = artUrl;
						this.#albumArt.alt = `${title} by ${artist}`;

						this.#albumArt.onerror = () => {
							if (youtubeId) {
								const fallbackUrl = ListenPageController.#getThumbnailUrl(
									youtubeId,
									{ quality: 'hq', format: 'webp' }
								);
								if (this.#albumArt.src !== fallbackUrl) {
									this.#albumArt.src = fallbackUrl;
									this.#albumArt.classList.add('fallback-crop');
								}
							}
						};
					}

					// Album art links to YouTube Music
					if (youtubeId) {
						this.#linkAlbumArt.href =
							ListenPageController.#buildYouTubeMusicUrl(youtubeId);
						this.#linkAlbumArt.removeAttribute('aria-disabled');
						this.#linkAlbumArt.style.pointerEvents = 'auto';
					} else if (title && artist) {
						this.#linkAlbumArt.href = ListenPageController.#buildYouTubeSearchUrl(
							title,
							artist
						);
						this.#linkAlbumArt.removeAttribute('aria-disabled');
						this.#linkAlbumArt.style.pointerEvents = 'auto';
					} else {
						this.#linkAlbumArt.removeAttribute('href');
						this.#linkAlbumArt.setAttribute('aria-disabled', 'true');
						this.#linkAlbumArt.style.pointerEvents = 'none';
					}

					// "Listen With Me" button (Metrolist)
					if (listenCode) {
						this.#btnMetrolist.href =
							ListenPageController.#buildMetrolistUrl(listenCode);
						this.#btnMetrolist.removeAttribute('hidden');
					} else {
						this.#btnMetrolist.setAttribute('hidden', '');
					}

					this.#updateMetadata(title, artist, ogImageUrl);

					this.#emptyCard.setAttribute('hidden', '');
					this.#emptyCard.classList.remove('is-visible');

					this.#playerCard.removeAttribute('hidden');
					this.#playerCard.classList.add('is-visible');
					if (this.#pageFooter) {
						this.#pageFooter.classList.add('is-visible');
					}
				}

				/**
				 * Displays the fallback state when no track payload is available.
				 * @private
				 * @returns {void}
				 */
				#renderEmpty() {
					this.#playerCard.setAttribute('hidden', '');
					this.#playerCard.classList.remove('is-visible');
					this.#ambientBackdrop.classList.remove('is-visible');

					this.#emptyCard.removeAttribute('hidden');
					this.#emptyCard.classList.add('is-visible');
					if (this.#pageFooter) {
						this.#pageFooter.classList.add('is-visible');
					}

					this.#updateMetadata();
				}
			}

			export const App = new ListenPageController();
			App.init();
		</script>
	</body>
</html>
