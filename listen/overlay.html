			html,
			body {
				background-color: transparent;
			}

			#music-widget {
				display: flex;
				align-items: center;
				gap: 1.5rem;
				transform: translateY(12px);
				opacity: 0;
				transition:
					opacity 1s var(--transition-easing),
					transform 1s var(--transition-easing);
				box-sizing: border-box;
				border: var(--border-width) solid var(--color-background);
				background-color: oklch(from var(--color-background) l c h / 98%);
				width: 100%;
				pointer-events: none;
				color: var(--color-text);
				font-family: var(--font-sans);

				&.is-visible {
					transform: translateY(0);
					opacity: 1;
					pointer-events: auto;
				}

				&.is-paused {
					.progress-fill {
						opacity: 0.5;
					}
					.marquee-track.scrolling {
						animation-play-state: paused;
					}
					.art-pause-overlay {
						opacity: 1 !important;
					}
				}

				&[hidden] {
					display: none !important;
				}

				.art-container {
					position: relative;
					flex-shrink: 0;
					overflow: hidden;
					line-height: 0;

					img {
						width: 120px;
						height: 120px;
						object-fit: cover;
					}

					.art-pause-overlay {
						display: flex;
						position: absolute;
						justify-content: center;
						align-items: center;
						opacity: 0;
						transition: opacity 1s var(--transition-easing);
						inset: 0;
						background-color: rgba(0, 0, 0, 0.5);
						color: var(--color-text);
					}
				}

				.text-container {
					display: flex;
					flex: 1 1 auto;
					flex-direction: column;
					justify-content: center;
					min-width: 0;
					overflow: hidden;

					.marquee-row {
						display: block;
						position: relative;
						width: 100%;
						overflow: hidden;
						white-space: nowrap;

						.marquee-track {
							display: flex;
							align-items: center;
							will-change: transform;
							width: max-content;
							white-space: nowrap;

							&.scrolling {
								animation: marquee-scroll linear infinite;
							}

							.marquee-group {
								display: flex;
								flex-shrink: 0;
								align-items: center;
								gap: 1.5rem;
								padding-right: 1.5rem;

								> * {
									margin-right: 0;
									margin-left: 0;
								}
							}

							.marquee-spacer {
								display: inline-block;
								opacity: 0.6;
								color: var(--color-accent);
							}
						}
					}

					.progress-bar {
						margin-top: 0.75rem;
						border-radius: 2px;
						background-color: oklch(from var(--color-text) l c h / 20%);
						width: 100%;
						height: 4px;
						overflow: hidden;

						.progress-fill {
							transform-origin: left;
							transition: opacity 1s var(--transition-easing);
							will-change: width;
							background-color: var(--color-accent);
							width: 0%;
							height: 100%;
						}
					}

					.track-name {
						margin: 0 0 0.2em 0;
						color: var(--color-text);
						font-size: 1.4rem;
						font-family: var(--font-sans);
					}

					.artist-name {
						margin: 0 0 0.2em 0;
						color: var(--color-accent);
						font-family: var(--font-mono);
					}

					.album-name {
						opacity: 0.8;
						margin: 0;
						color: var(--color-text);
						font-family: var(--font-sans);
					}
				}

				.qr-container {
					flex-shrink: 0;

					svg {
						display: block;
						shape-rendering: crispEdges;
						background-color: var(--color-text);
						padding: 0.4rem;
						width: 120px;
						height: 120px;

						path {
							fill: var(--color-background);
						}
					}
				}
			}

			@keyframes marquee-scroll {
				0% {
					transform: translateX(0);
				}
				100% {
					transform: translateX(-50%);
				}
			}
		</style>

	<body>
		<div id="music-widget" hidden>
			<div class="art-container">
				<img id="album-art" src="" alt="Album Art" />
				<div class="art-pause-overlay" aria-hidden="true">
					<svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
						<rect x="6" y="5" width="4" height="14" />
						<rect x="14" y="5" width="4" height="14" />
					</svg>
				</div>
			</div>
			<div class="text-container">
				<div class="marquee-row">
					<div id="track-name-track" class="marquee-track">
						<h2 id="track-name" class="track-name text-size-h3"></h2>
					</div>
				</div>
				<div class="marquee-row">
					<div id="artist-name-track" class="marquee-track">
						<h3 id="artist-name" class="artist-name text-size-h4"></h3>
					</div>
				</div>
				<div class="marquee-row">
					<div id="album-name-track" class="marquee-track">
						<h4 id="album-name" class="album-name text-caption"></h4>
					</div>
				</div>
				<div class="progress-bar">
					<div id="progress-fill" class="progress-fill"></div>
				</div>
			</div>
			<div id="qr-container" class="qr-container"></div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"protobufjs/light.js": "https://esm.sh/protobufjs/light.js"
				}
			}
		</script>

		<script type="module">
			import QRCode from 'https://esm.sh/qrcode';

			import { ListenTogetherClient } from './listen-client.js';

			class OverlayController {
				/**
				 * @private
				 * @type {HTMLElement|null} The main container element for the widget.
				 */
				#widgetElement;

				/**
				 * @private
				 * @type {HTMLElement|null} The container for the track name marquee.
				 */
				#trackTrack;

				/**
				 * @private
				 * @type {HTMLElement|null} The container for the artist name marquee.
				 */
				#artistTrack;

				/**
				 * @private
				 * @type {HTMLElement|null} The container for the album name marquee.
				 */
				#albumTrack;

				/**
				 * @private
				 * @type {HTMLImageElement|null} The element displaying the album artwork.
				 */
				#artElement;

				/**
				 * @private
				 * @type {HTMLElement|null} The container for the injected QR code SVG.
				 */
				#qrContainer;

				/**
				 * @private
				 * @type {HTMLElement|null} The element representing the visual progress bar fill.
				 */
				#progressFill;

				/**
				 * @private
				 * @type {string} The parsed or loaded listen together room code.
				 */
				#listenCode;

				/**
				 * @private
				 * @type {string} The WebSocket server URL to connect to.
				 */
				#serverUrl;

				/**
				 * @private
				 * @type {string} A concatenated signature of the track metadata used to prevent redundant UI updates.
				 */
				#lastActivitySignature;

				/**
				 * @private
				 * @type {number|null} The timeout ID for hiding the overlay after inactivity.
				 */
				#hideTimeout;

				/**
				 * @private
				 * @type {ListenTogetherClient} The client instance managing the WebSocket connection.
				 */
				#listenClient;

				/**
				 * @private
				 * @type {boolean|null} The previously tracked playing state used to detect transitions.
				 */
				#wasPlaying;

				/**
				 * @private
				 * @type {number|null} The active requestAnimationFrame ID for the progress loop.
				 */
				#animationFrame;

				constructor() {
					this.#widgetElement = document.getElementById('music-widget');
					this.#trackTrack = document.getElementById('track-name-track');
					this.#artistTrack = document.getElementById('artist-name-track');
					this.#albumTrack = document.getElementById('album-name-track');
					this.#artElement = document.getElementById('album-art');
					this.#qrContainer = document.getElementById('qr-container');
					this.#progressFill = document.getElementById('progress-fill');

					const params = this.#parseUrlParams();
					let code = params.code;
					if (!code) {
						try {
							const xhr = new XMLHttpRequest();
							xhr.open('GET', './listen_key.txt', false);
							xhr.send(null);
							if (xhr.status === 200 || xhr.status === 0) {
								code = xhr.responseText.trim();
							}
						} catch {
							code = '';
						}
					}
					this.#listenCode = code;
					this.#serverUrl = params.server || 'wss://metroserverx.meowery.eu/ws';

					this.#lastActivitySignature = '';
					this.#hideTimeout = null;
					this.#wasPlaying = null;
					this.#animationFrame = null;

					this.#listenClient = new ListenTogetherClient(this.#listenCode, {
						username: 'Rouge Overlay',
						serverUrl: this.#serverUrl,
					});
				}

				/**
				 * @returns {number} The duration of the fade-out transition in milliseconds.
				 * @constant
				 */
				static get HIDE_TRANSITION_MS() {
					return 500;
				}

				/**
				 * @returns {string} The base URL for the Listen page.
				 * @constant
				 */
				static get LISTEN_PAGE_URL() {
					return 'https://eric-lowry.com/listen';
				}

				/**
				 * @private
				 * @returns {string} The calculated base URL for the Listen page, preferring explicit hostname or localhost over the remote origin.
				 */
				static #resolveListenBaseUrl() {
					if (
						window.location.hostname === 'localhost'
						|| window.location.hostname === '[IP_ADDRESS]'
					) {
						return `${window.location.protocol}//${window.location.hostname}:3000/listen`;
					}
					return OverlayController.LISTEN_PAGE_URL;
				}

				/**
				 * Initializes the overlay, waits for font loading, and connects to the WebSocket.
				 * @returns {Promise<void>}
				 */
				async init() {
					if (document.fonts) {
						await document.fonts.ready;
					}

					const initialUrl = await this.#generateQrCode();
					if (initialUrl) {
						console.log(`🔗 Listen Link: ${initialUrl}`);
					}

					this.#listenClient.addEventListener('track-changed', (e) => {
						this.#updateUI(e.detail);
					});

					this.#listenClient.addEventListener('error-payload', (e) => {
						if (
							e.detail.code === 'room_not_found'
							|| e.detail.code === 'room_invalid'
						) {
							this.#listenClient.disconnect();
							this.#hideUI();
						}
					});

					this.#listenClient.addEventListener('kicked', () => {
						this.#listenClient.disconnect();
						this.#hideUI();
					});

					this.#listenClient.addEventListener('reconnect-failed', () => {
						this.#hideUI();
					});

					this.#animateProgress();

					try {
						await this.#listenClient.init();
					} catch (error) {
						console.error('Failed to initialize ListenTogetherClient:', error);
						this.#hideUI();
					}
				}

				/**
				 * Scales Google User Content / YouTube thumbnail URLs to custom dimensions.
				 * @private
				 * @param {string} url The image URL to scale.
				 * @param {number} [size=200] The target square dimension in pixels.
				 * @returns {string} The updated thumbnail URL with requested size.
				 */
				static #scaleThumbnailUrl(url, size = 200) {
					if (!url) {
						return '';
					}
					if (url.includes('googleusercontent.com') || url.includes('yt3.ggpht.com')) {
						return url.replace(/=(s|w)\d+.*$/, `=s${size}`);
					}
					return url;
				}

				/**
				 * @returns {Object} An object containing the extracted listen code and server URL.
				 * @private
				 */
				#parseUrlParams() {
					const searchParams = new URLSearchParams(window.location.search);
					let code = searchParams.get('code') || searchParams.get('c') || '';
					let server = searchParams.get('server') || searchParams.get('s') || '';

					if (!code && window.location.hash) {
						const hashParams = new URLSearchParams(
							window.location.hash.replace(/^#/, '')
						);
						code = hashParams.get('code') || hashParams.get('c') || '';
						server = hashParams.get('server') || hashParams.get('s') || server;
					}

					return { code, server };
				}

				/**
				 * Generates and injects the QR code SVG for the listen together session.
				 * @private
				 * @param {string|null} [youtubeId=null] The YouTube video ID to append for the fallback state.
				 * @returns {Promise<string|null>} The generated target URL, or null if generation fails.
				 */
				async #generateQrCode(youtubeId = null) {
					if (!this.#listenCode) {
						return null;
					}

					try {
						const targetUrl = new URL(OverlayController.#resolveListenBaseUrl());
						targetUrl.searchParams.set('code', this.#listenCode);

						if (
							this.#serverUrl
							&& this.#serverUrl !== 'wss://metroserverx.meowery.eu/ws'
						) {
							targetUrl.searchParams.set('server', this.#serverUrl);
						}

						if (youtubeId) {
							targetUrl.searchParams.set('v', youtubeId);
						}

						const urlString = targetUrl.toString();
						const svgString = await QRCode.toString(urlString, {
							type: 'svg',
							margin: 0,
							color: {
								light: '#0000',
								dark: '#000',
							},
						});

						this.#qrContainer.innerHTML = svgString;
						return urlString;
					} catch (error) {
						console.error('Failed to generate listen QR code:', error);
						return null;
					}
				}

				/**
				 * Animation loop for updating the playback progress bar and paused UI state.
				 * @private
				 */
				#animateProgress() {
					if (this.#listenClient) {
						const progress = this.#listenClient.playbackProgress;

						if (progress && progress.duration > 0) {
							if (this.#progressFill) {
								this.#progressFill.style.width = `${progress.percent * 100}%`;
							}

							if (progress.isPlaying !== this.#wasPlaying) {
								this.#wasPlaying = progress.isPlaying;
								if (this.#widgetElement) {
									this.#widgetElement.classList.toggle(
										'is-paused',
										!progress.isPlaying
									);
								}
							}
						} else {
							if (this.#progressFill) {
								this.#progressFill.style.width = '0%';
							}

							if (this.#wasPlaying !== false) {
								this.#wasPlaying = false;
								if (this.#widgetElement) {
									this.#widgetElement.classList.remove('is-paused');
								}
							}
						}
					}

					this.#animationFrame = requestAnimationFrame(() => this.#animateProgress());
				}

				/**
				 * Wraps text in animated marquee elements if it overflows the bounding container.
				 * @private
				 * @param {HTMLElement} trackElement The container element for the marquee track.
				 * @param {string} text The string content to render.
				 * @param {string} tag The HTML tag name to use for the text element.
				 * @param {string} className The CSS class string to apply to the text element.
				 */
				#setMarqueeText(trackElement, text, tag, className) {
					const row = trackElement ? trackElement.parentElement : null;
					if (!trackElement || !row) {
						return;
					}

					if (trackElement.dataset.currentText === text) {
						return;
					}
					trackElement.dataset.currentText = text;

					trackElement.classList.remove('scrolling');
					trackElement.style.animationDuration = '0s';

					if (!text) {
						trackElement.replaceChildren();
						return;
					}

					const singleItem = document.createElement(tag);
					singleItem.className = className;
					singleItem.textContent = text;
					trackElement.replaceChildren(singleItem);

					requestAnimationFrame(() => {
						const isOverflowing = singleItem.scrollWidth > row.clientWidth;

						if (isOverflowing) {
							const group1 = document.createElement('div');
							group1.className = 'marquee-group';

							const heading = document.createElement(tag);
							heading.className = className;
							heading.textContent = text;

							const spacer = document.createElement('span');
							spacer.className = 'marquee-spacer';
							spacer.setAttribute('aria-hidden', 'true');
							spacer.textContent = '•';

							group1.append(heading, spacer);

							const group2 = group1.cloneNode(true);
							group2.setAttribute('aria-hidden', 'true');

							trackElement.replaceChildren(group1, group2);

							const durationSeconds = Math.max(
								12,
								Math.round(group1.offsetWidth / 25)
							);
							trackElement.style.animationDuration = `${durationSeconds}s`;
							trackElement.classList.add('scrolling');
						}
					});
				}

				/**
				 * Updates the overlay UI elements with current track data and regenerates the QR code.
				 * @private
				 * @param {Object|null} trackData The metadata object representing the currently playing track.
				 */
				#updateUI(trackData) {
					clearTimeout(this.#hideTimeout);

					if (!trackData) {
						this.#hideUI();
						this.#generateQrCode().then((url) => {
							if (url) {
								console.log(`🔗 Listen Link: ${url}`);
							}
						});
						return;
					}

					if (this.#widgetElement && this.#widgetElement.hasAttribute('hidden')) {
						this.#widgetElement.removeAttribute('hidden');
						void this.#widgetElement.offsetHeight;
					}
					if (this.#widgetElement) {
						this.#widgetElement.classList.add('is-visible');
					}

					const title = trackData.title || 'Unknown Track';
					const artist = trackData.artist || 'Unknown Artist';
					const album = trackData.album || '';
					const artUrl = trackData.thumbnail || '';
					const youtubeId = trackData.id || '';
					const scaledArtUrl = OverlayController.#scaleThumbnailUrl(artUrl, 240);

					const activitySignature = `${title}|${artist}|${album}|${scaledArtUrl}`;

					if (activitySignature === this.#lastActivitySignature) {
						return;
					}
					this.#lastActivitySignature = activitySignature;

					this.#generateQrCode(youtubeId).then((url) => {
						if (url) {
							console.log(
								`${title} · ${album ? album + ' ' : ''}(${artist})\n${url}`
							);
						}
					});

					this.#setMarqueeText(this.#trackTrack, title, 'h2', 'track-name text-size-h3');
					this.#setMarqueeText(
						this.#artistTrack,
						artist,
						'h3',
						'artist-name text-size-h4'
					);
					this.#setMarqueeText(this.#albumTrack, album, 'h4', 'album-name text-caption');

					if (scaledArtUrl && this.#artElement && this.#artElement.src !== scaledArtUrl) {
						this.#artElement.src = scaledArtUrl;
					}
				}

				/**
				 * Fades out and hides the entire widget element.
				 * @private
				 */
				#hideUI() {
					if (!this.#widgetElement) {
						return;
					}

					if (
						this.#widgetElement.hasAttribute('hidden')
						&& !this.#widgetElement.classList.contains('is-visible')
					) {
						return;
					}

					this.#lastActivitySignature = '';
					this.#widgetElement.classList.remove('is-visible');
					clearTimeout(this.#hideTimeout);
					this.#hideTimeout = setTimeout(() => {
						if (
							this.#widgetElement
							&& !this.#widgetElement.classList.contains('is-visible')
						) {
							this.#widgetElement.setAttribute('hidden', '');
						}
					}, OverlayController.HIDE_TRANSITION_MS);
				}
			}

			export const App = new OverlayController();
			App.init();
		</script>
	</body>
</html>
