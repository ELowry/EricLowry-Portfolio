			html,
			body {
				background-color: transparent;
			}

			#music-widget {
				display: flex;
				align-items: center;
				gap: 1.5rem;
				transform: translateY(12px);
				opacity: 0;
				transition:
					opacity 1s var(--transition-easing),
					transform 1s var(--transition-easing);
				box-sizing: border-box;
				border: var(--border-width) solid var(--color-background);
				background-color: oklch(from var(--color-background) l c h / 98%);
				width: 100%;
				pointer-events: none;
				color: var(--color-text);
				font-family: var(--font-sans);

				&.is-visible {
					transform: translateY(0);
					opacity: 1;
					pointer-events: auto;
				}

				&.is-paused {
					.progress-fill {
						opacity: 0.5;
					}
					.marquee-track.scrolling {
						animation-play-state: paused;
					}
					.art-pause-overlay {
						opacity: 1 !important;
					}
				}

				&[hidden] {
					display: none !important;
				}

				.art-container {
					position: relative;
					flex-shrink: 0;
					overflow: hidden;
					line-height: 0;

					img {
						width: 120px;
						height: 120px;
						object-fit: cover;
					}

					.art-pause-overlay {
						display: flex;
						position: absolute;
						justify-content: center;
						align-items: center;
						opacity: 0;
						transition: opacity 1s var(--transition-easing);
						inset: 0;
						background-color: rgba(0, 0, 0, 0.5);
						color: var(--color-text);
					}
				}

				.text-container {
					display: flex;
					flex: 1 1 auto;
					flex-direction: column;
					justify-content: center;
					min-width: 0;
					overflow: hidden;

					.marquee-row {
						display: block;
						position: relative;
						width: 100%;
						overflow: hidden;
						white-space: nowrap;

						.marquee-track {
							display: flex;
							align-items: center;
							will-change: transform;
							width: max-content;
							white-space: nowrap;

							&.scrolling {
								animation: marquee-scroll linear infinite;
							}

							.marquee-group {
								display: flex;
								flex-shrink: 0;
								align-items: center;
								gap: 1.5rem;
								padding-right: 1.5rem;

								> * {
									margin-right: 0;
									margin-left: 0;
								}
							}

							.marquee-spacer {
								display: inline-block;
								opacity: 0.6;
								color: var(--color-accent);
							}
						}
					}

					.progress-bar {
						margin-top: 0.75rem;
						border-radius: 2px;
						background-color: oklch(from var(--color-text) l c h / 20%);
						width: 100%;
						height: 4px;
						overflow: hidden;

						.progress-fill {
							transform-origin: left;
							transition: opacity 1s var(--transition-easing);
							will-change: width;
							background-color: var(--color-accent);
							width: 0%;
							height: 100%;
						}
					}

					.track-name {
						margin: 0 0 0.2em 0;
						color: var(--color-text);
						font-size: 1.4rem;
						font-family: var(--font-sans);
					}

					.artist-name {
						margin: 0 0 0.2em 0;
						color: var(--color-accent);
						font-family: var(--font-mono);
					}

					.album-name {
						opacity: 0.8;
						margin: 0;
						color: var(--color-text);
						font-family: var(--font-sans);
					}
				}

				.qr-container {
					flex-shrink: 0;

					svg {
						display: block;
						shape-rendering: crispEdges;
						background-color: var(--color-text);
						padding: 0.4rem;
						width: 120px;
						height: 120px;

						path {
							fill: var(--color-background);
						}
					}
				}
			}

			@keyframes marquee-scroll {
				0% {
					transform: translateX(0);
				}
				100% {
					transform: translateX(-50%);
				}
			}

	<body>
		<div id="music-widget" hidden>
			<div class="art-container">
				<img id="album-art" src="" alt="Album Art" />
				<div class="art-pause-overlay" aria-hidden="true">
					<svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
						<rect x="6" y="5" width="4" height="14" />
						<rect x="14" y="5" width="4" height="14" />

			</div>
			<div class="text-container">
				<div class="marquee-row">
					<div id="track-name-track" class="marquee-track">

					</div>
				</div>
				<div class="marquee-row">
					<div id="artist-name-track" class="marquee-track">
						<h3 id="artist-name" class="artist-name text-size-h4"></h3>

				<div class="marquee-row">

				</div>
			</div>
			<div id="qr-container" class="qr-container"></div>
		</div>

		<script type="module">
			import protobuf from 'https://esm.sh/protobufjs';
			import QRCode from 'https://esm.sh/qrcode';

			class ListenTogetherClient extends EventTarget {
				#ws = null;
				#protoRoot = null;
				#roomCode;
				#username;
				#serverUrl;
				#currentTrack = null;
				#isPlaying = false;
				#position = 0;
				#lastUpdate = 0;
				#reconnectTimer = null;
				#pingInterval = null;
				#pingSequence = 0;

				constructor(
					roomCode,
					{ username = 'Widget', serverUrl = 'wss://metroserverx.meowery.eu/ws' } = {}
				) {
					super();
					this.#roomCode = roomCode;
					this.#username = username;
					this.#serverUrl = serverUrl;
				}

				get playbackProgress() {
					if (!this.#currentTrack) {
						return null;
					}

					let livePosition = this.#position;

					if (this.#isPlaying) {
						livePosition += Date.now() - this.#lastUpdate;
					}

					const clampedPosition = Math.max(
						0,
						Math.min(livePosition, this.#currentTrack.duration)
					);

					return {
						position: clampedPosition,
						duration: this.#currentTrack.duration,
						percent: Math.min(clampedPosition / this.#currentTrack.duration, 1),
						isPlaying: this.#isPlaying,
					};
				}

				get currentTrack() {
					return this.#currentTrack;
				}

				static get PROTO_DEF() {
					return `
					syntax = "proto3";
					package listentogether;

					message Envelope {
						string type = 1;
						bytes payload = 2;
						bool compressed = 3;
					}
					message TrackInfo {
						string id = 1;
						string title = 2;
						string artist = 3;
						string album = 4;
						int64 duration = 5;
						string thumbnail = 6;
						string suggested_by = 7;
					}
					message RoomState {
						string room_code = 1;
						string host_id = 2;
						TrackInfo current_track = 4;
						bool is_playing = 5;
						int64 position = 6;
						int64 last_update = 7;
						float volume = 8;
						uint64 revision = 10;
					}
					message ClientCapabilities {
						bool supports_protobuf = 1;
						bool supports_compression = 2;
						string client_version = 3;
					}
					message JoinRoomPayload {
						string room_code = 1;
						string username = 2;
					}
					message JoinApprovedPayload {
						string room_code = 1;
						string user_id = 2;
						string session_token = 3;
						RoomState state = 4;
					}
					message SyncStatePayload {
						TrackInfo current_track = 1;
						bool is_playing = 2;
						int64 position = 3;
						int64 last_update = 4;
						float volume = 6;
						uint64 revision = 7;
					}
					message PlaybackActionPayload {
						string action = 1;
						string track_id = 2;
						int64 position = 3;
						TrackInfo track_info = 4;
						bool insert_next = 5;
						repeated TrackInfo queue = 6;
						string queue_title = 7;
						float volume = 8;
						int64 server_time = 9;
						uint64 revision = 10;
						int64 captured_at_server_time = 11;
					}
					message PingPayload {
						int64 client_time = 1;
						uint64 sequence = 2;
					}
					message ErrorPayload {
						string code = 1;
						string message = 2;
					}
					message KickedPayload {
						string reason = 1;
					}`;
				}

				#toNumber(value, fallback = 0) {
					if (value === null || value === undefined) return fallback;
					if (typeof value.toNumber === 'function') return value.toNumber();
					return Number(value);
				}

				async #decompressGzip(compressedBytes) {
					const ds = new DecompressionStream('gzip');
					const writer = ds.writable.getWriter();
					writer.write(compressedBytes).catch(() => {});
					writer.close();

					const response = new Response(ds.readable);
					const buffer = await response.arrayBuffer();
					return new Uint8Array(buffer);
				}

				#sendMessage(msgType, payloadMessage, protoMessageName) {
					if (!this.#ws || this.#ws.readyState !== WebSocket.OPEN) return;

					const PayloadType = this.#protoRoot.lookupType(
						`listentogether.${protoMessageName}`
					);
					const message = PayloadType.create(payloadMessage);
					const payloadBytes = PayloadType.encode(message).finish();

					const Envelope = this.#protoRoot.lookupType('listentogether.Envelope');
					const envMessage = Envelope.create({
						type: msgType,
						payload: payloadBytes,
						compressed: false,
					});
					const envelopeBytes = Envelope.encode(envMessage).finish();

					this.#ws.send(envelopeBytes);
				}

				#sendHandshake() {
					this.#sendMessage(
						'client_capabilities',
						{
							supportsProtobuf: true,
							supportsCompression: true,
							clientVersion: '1',
						},
						'ClientCapabilities'
					);
				}

				#sendJoinRequest() {
					this.#sendMessage(
						'join_room',
						{
							roomCode: this.#roomCode,
							username: this.#username,
						},
						'JoinRoomPayload'
					);
				}

				#sendPing() {
					this.#sendMessage(
						'ping',
						{
							clientTime: Date.now(),
							sequence: ++this.#pingSequence,
						},
						'PingPayload'
					);
				}

				async #handleMessage(buffer) {
					const dataBytes = new Uint8Array(buffer);
					const Envelope = this.#protoRoot.lookupType('listentogether.Envelope');

					let envelope;
					try {
						envelope = Envelope.decode(dataBytes);
					} catch (error) {
						console.error('Failed to decode envelope:', error);
						return;
					}

					let payloadBytes = envelope.payload;
					if (envelope.compressed) {
						try {
							payloadBytes = await this.#decompressGzip(payloadBytes);
						} catch (error) {
							console.error('Failed to decompress gzip payload:', error);
							return;
						}
					}

					switch (envelope.type) {
						case 'error': {
							const ErrorType = this.#protoRoot.lookupType(
								'listentogether.ErrorPayload'
							);
							const errorData = ErrorType.decode(payloadBytes);
							console.error(`Server Error [${errorData.code}]:`, errorData.message);
							this.dispatchEvent(
								new CustomEvent('error-payload', { detail: errorData })
							);
							break;
						}
						case 'join_approved': {
							const JoinType = this.#protoRoot.lookupType(
								'listentogether.JoinApprovedPayload'
							);
							const joinData = JoinType.decode(payloadBytes);
							if (joinData.state) {
								this.#applySyncState(joinData.state);
							}
							break;
						}
						case 'sync_state': {
							const SyncType = this.#protoRoot.lookupType(
								'listentogether.SyncStatePayload'
							);
							const syncData = SyncType.decode(payloadBytes);
							this.#applySyncState(syncData);
							break;
						}
						case 'sync_playback': {
							const PlaybackType = this.#protoRoot.lookupType(
								'listentogether.PlaybackActionPayload'
							);
							const actionData = PlaybackType.decode(payloadBytes);
							this.#applyPlaybackAction(actionData);
							break;
						}
						case 'kicked': {
							const KickedType = this.#protoRoot.lookupType(
								'listentogether.KickedPayload'
							);
							const kickedData = KickedType.decode(payloadBytes);
							console.warn(`Kicked from room: ${kickedData.reason}`);
							this.dispatchEvent(new CustomEvent('kicked', { detail: kickedData }));
							break;
						}
					}
				}

				#applySyncState(state) {
					this.#isPlaying = state.isPlaying || false;
					this.#position = this.#toNumber(state.position);
					this.#lastUpdate = Date.now();

					if (state.currentTrack) {
						this.#currentTrack = {
							id: state.currentTrack.id,
							title: state.currentTrack.title,
							artist: state.currentTrack.artist,
							album: state.currentTrack.album,
							duration: this.#toNumber(state.currentTrack.duration),
							thumbnail: state.currentTrack.thumbnail,
						};
					} else {
						this.#currentTrack = null;
					}

					this.dispatchEvent(new CustomEvent('state-synced'));
					this.dispatchEvent(
						new CustomEvent('track-changed', { detail: this.#currentTrack })
					);
				}

				#applyPlaybackAction(actionData) {
					this.#lastUpdate = Date.now();

					switch (actionData.action) {
						case 'play':
							this.#isPlaying = true;
							this.#position = this.#toNumber(actionData.position);
							break;
						case 'pause':
							this.#isPlaying = false;
							this.#position = this.#toNumber(actionData.position);
							break;
						case 'seek':
						case 'change_track':
						case 'sync_queue':
							this.#position = this.#toNumber(actionData.position);
							if (actionData.trackInfo) {
								this.#currentTrack = {
									id: actionData.trackInfo.id,
									title: actionData.trackInfo.title,
									artist: actionData.trackInfo.artist,
									album: actionData.trackInfo.album,
									duration: this.#toNumber(actionData.trackInfo.duration),
									thumbnail: actionData.trackInfo.thumbnail,
								};
								this.dispatchEvent(
									new CustomEvent('track-changed', { detail: this.#currentTrack })
								);
							} else if (actionData.action === 'change_track') {
								this.#currentTrack = null;
								this.dispatchEvent(
									new CustomEvent('track-changed', { detail: null })
								);
							}
							break;
					}

					this.dispatchEvent(
						new CustomEvent('state-synced', { detail: this.playbackProgress })
					);
				}

				#handleDisconnect() {
					if (this.#pingInterval) {
						clearInterval(this.#pingInterval);
						this.#pingInterval = null;
					}

					console.warn('ListenTogether WebSocket closed. Reconnecting in 5s...');
					this.#ws = null;
					this.#reconnectTimer = setTimeout(() => {
						this.init().catch(() => this.#handleDisconnect());
					}, 5000);
				}

				async init() {
					if (this.#reconnectTimer) {
						clearTimeout(this.#reconnectTimer);
						this.#reconnectTimer = null;
					}

					if (!this.#protoRoot) {
						this.#protoRoot = protobuf.parse(ListenTogetherClient.PROTO_DEF).root;
					}

					return new Promise((resolve) => {
						this.#ws = new WebSocket(this.#serverUrl);
						this.#ws.binaryType = 'arraybuffer';

						this.#ws.addEventListener('open', () => {
							this.#sendHandshake();
							this.#sendJoinRequest();

							this.#pingInterval = setInterval(() => this.#sendPing(), 30000);
							resolve();
						});

						this.#ws.addEventListener('message', async (event) => {
							await this.#handleMessage(event.data);
						});

						this.#ws.addEventListener('error', (err) => {
							console.error('ListenTogether WebSocket Error:', err);
						});

						this.#ws.addEventListener('close', () => {
							this.#handleDisconnect();
						});
					});
				}

				disconnect() {
					if (this.#reconnectTimer) {
						clearTimeout(this.#reconnectTimer);
						this.#reconnectTimer = null;
					}
					if (this.#pingInterval) {
						clearInterval(this.#pingInterval);
						this.#pingInterval = null;
					}

					if (this.#ws && this.#ws.readyState === WebSocket.OPEN) {
						this.#ws.close();
					}
				}
			}

			class OverlayController {
				#widgetElement;
				#trackTrack;
				#artistTrack;
				#albumTrack;
				#artElement;
				#qrContainer;
				#progressFill;
				#listenCode;
				#serverUrl;
				#lastActivitySignature;
				#hideTimeout;
				#listenClient;
				#wasPlaying;
				#animationFrame;

				constructor() {
					this.#widgetElement = document.getElementById('music-widget');
					this.#trackTrack = document.getElementById('track-name-track');
					this.#artistTrack = document.getElementById('artist-name-track');
					this.#albumTrack = document.getElementById('album-name-track');
					this.#artElement = document.getElementById('album-art');
					this.#qrContainer = document.getElementById('qr-container');
					this.#progressFill = document.getElementById('progress-fill');

					const params = this.#parseUrlParams();
					this.#listenCode = params.code;
					this.#serverUrl = params.server || 'wss://metroserverx.meowery.eu/ws';

					this.#lastActivitySignature = '';
					this.#hideTimeout = null;
					this.#wasPlaying = null;
					this.#animationFrame = null;

					this.#listenClient = new ListenTogetherClient(this.#listenCode, {
						serverUrl: this.#serverUrl,
					});
				}

				static get HIDE_TRANSITION_MS() {
					return 500;
				}

				static get LISTEN_PAGE_URL() {
					return 'https://metrolist.cc/listen';
				}

				static #resolveListenBaseUrl() {
					if (
						window.location.hostname === 'localhost'
						|| window.location.hostname === '127.0.0.1'
					) {
						return `${window.location.origin}/listen`;
					}
					return OverlayController.LISTEN_PAGE_URL;
				}

				static #scaleThumbnailUrl(url, size = 200) {
					if (!url) {
						return '';
					}
					if (url.includes('googleusercontent.com') || url.includes('yt3.ggpht.com')) {
						return url.replace(/=(s|w)\d+.*$/, `=s${size}`);
					}
					return url;
				}

				#parseUrlParams() {
					const searchParams = new URLSearchParams(window.location.search);
					let code = searchParams.get('code') || searchParams.get('c') || '';
					let server = searchParams.get('server') || searchParams.get('s') || '';

					if (!code && window.location.hash) {
						const hashParams = new URLSearchParams(
							window.location.hash.replace(/^#/, '')
						);
						code = hashParams.get('code') || hashParams.get('c') || '';
						server = hashParams.get('server') || hashParams.get('s') || server;
					}

					return { code, server };
				}

				async #generateQrCode() {
					if (!this.#listenCode) {
						return;
					}

					try {
						const targetUrl = new URL(OverlayController.#resolveListenBaseUrl());
						targetUrl.searchParams.set('code', this.#listenCode);

						if (
							this.#serverUrl
							&& this.#serverUrl !== 'wss://metroserverx.meowery.eu/ws'
						) {
							targetUrl.searchParams.set('server', this.#serverUrl);
						}

						const svgString = await QRCode.toString(targetUrl.toString(), {
							type: 'svg',
							margin: 0,
							color: {
								light: '#0000',
								dark: '#000',
							},
						});

						this.#qrContainer.innerHTML = svgString;
					} catch (error) {
						console.error('Failed to generate listen QR code:', error);
					}
				}

				#animateProgress = () => {
					if (this.#listenClient) {
						const progress = this.#listenClient.playbackProgress;

						if (progress && progress.duration > 0) {
							this.#progressFill.style.width = `${progress.percent * 100}%`;

							if (progress.isPlaying !== this.#wasPlaying) {
								this.#wasPlaying = progress.isPlaying;
								this.#widgetElement.classList.toggle(
									'is-paused',
									!progress.isPlaying
								);
							}
						} else {
							this.#progressFill.style.width = '0%';

							if (this.#wasPlaying !== false) {
								this.#wasPlaying = false;
								this.#widgetElement.classList.remove('is-paused');
							}
						}
					}

					this.#animationFrame = requestAnimationFrame(() => this.#animateProgress());
				};

				#setMarqueeText(trackElement, text, tag, className) {
					const row = trackElement ? trackElement.parentElement : null;
					if (!trackElement || !row) {
						return;
					}

					if (trackElement.dataset.currentText === text) {
						return;
					}
					trackElement.dataset.currentText = text;

					trackElement.classList.remove('scrolling');
					trackElement.style.animationDuration = '0s';

					if (!text) {
						trackElement.replaceChildren();
						return;
					}

					const singleItem = document.createElement(tag);
					singleItem.className = className;
					singleItem.textContent = text;
					trackElement.replaceChildren(singleItem);

					requestAnimationFrame(() => {
						const isOverflowing = singleItem.scrollWidth > row.clientWidth;

						if (isOverflowing) {
							const group1 = document.createElement('div');
							group1.className = 'marquee-group';

							const heading = document.createElement(tag);
							heading.className = className;
							heading.textContent = text;

							const spacer = document.createElement('span');
							spacer.className = 'marquee-spacer';
							spacer.setAttribute('aria-hidden', 'true');
							spacer.textContent = '•';

							group1.append(heading, spacer);

							const group2 = group1.cloneNode(true);
							group2.setAttribute('aria-hidden', 'true');

							trackElement.replaceChildren(group1, group2);

							const durationSeconds = Math.max(
								12,
								Math.round(group1.offsetWidth / 25)
							);
							trackElement.style.animationDuration = `${durationSeconds}s`;
							trackElement.classList.add('scrolling');
						}
					});
				}

				#updateUI(trackData) {
					clearTimeout(this.#hideTimeout);

					if (!trackData) {
						this.#hideUI();
						return;
					}

					if (this.#widgetElement.hasAttribute('hidden')) {
						this.#widgetElement.removeAttribute('hidden');
						void this.#widgetElement.offsetHeight;
					}
					this.#widgetElement.classList.add('is-visible');

					const title = trackData.title || 'Unknown Track';
					const artist = trackData.artist || 'Unknown Artist';
					const album = trackData.album || '';
					const artUrl = trackData.thumbnail || '';
					const scaledArtUrl = OverlayController.#scaleThumbnailUrl(artUrl, 240);

					const activitySignature = `${title}|${artist}|${album}|${scaledArtUrl}`;

					if (activitySignature === this.#lastActivitySignature) {
						return;
					}
					this.#lastActivitySignature = activitySignature;

					this.#setMarqueeText(this.#trackTrack, title, 'h2', 'track-name text-size-h3');
					this.#setMarqueeText(
						this.#artistTrack,
						artist,
						'h3',
						'artist-name text-size-h4'
					);
					this.#setMarqueeText(this.#albumTrack, album, 'h4', 'album-name text-caption');

					if (scaledArtUrl && this.#artElement.src !== scaledArtUrl) {
						this.#artElement.src = scaledArtUrl;
					}
				}

				#hideUI() {
					if (
						this.#widgetElement.hasAttribute('hidden')
						&& !this.#widgetElement.classList.contains('is-visible')
					) {
						return;
					}

					this.#lastActivitySignature = '';
					this.#widgetElement.classList.remove('is-visible');
					clearTimeout(this.#hideTimeout);
					this.#hideTimeout = setTimeout(() => {
						if (!this.#widgetElement.classList.contains('is-visible')) {
							this.#widgetElement.setAttribute('hidden', '');
						}
					}, OverlayController.HIDE_TRANSITION_MS);
				}

				async init() {
					if (document.fonts) {
						await document.fonts.ready;
					}

					await this.#generateQrCode();

					this.#listenClient.addEventListener('track-changed', (e) => {
						this.#updateUI(e.detail);
					});

					this.#listenClient.addEventListener('error-payload', (e) => {
						if (
							e.detail.code === 'room_not_found'
							|| e.detail.code === 'room_invalid'
						) {
							this.#listenClient.disconnect();
							this.#hideUI();
						}
					});

					this.#listenClient.addEventListener('kicked', () => {
						this.#listenClient.disconnect();
						this.#hideUI();
					});

					try {
						await this.#listenClient.init();
						this.#animateProgress();
					} catch (error) {
						console.error('Failed to initialize ListenTogetherClient:', error);
						this.#hideUI();
					}
				}
			}

			export const App = new OverlayController();
			App.init();
		</script>
	</body>
</html>
